<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Parameters</title>
<style>
    /* ------------------------------------------------------------------
       Thèmes : la palette suit le thème de l'interface Fusion (data-theme).
       Les couleurs ci-dessous sont des approximations : pour les ajuster,
       modifiez uniquement --bg, --panel, --field et --line de chaque thème.
       ------------------------------------------------------------------ */
    :root {
        color-scheme: dark;
        --bg: #2f2f2f;
        --panel: #383838;
        --field: #232323;
        --line: #4a4a4a;
        --line-soft: #3d3d3d;
        --text: #e8e8e8;
        --muted: #a3a3a3;
        --accent: #5aa9e6;
        --onaccent: #10222f;
        --warn: #e3b341;
        --danger: #f0707a;
        --ondanger: #1b1b1b;
        --ok: #6cc08b;
        --mono: Consolas, "SF Mono", Menlo, "Liberation Mono", monospace;
    }
    :root[data-theme="darkblue"] {
        --bg: #26323f; --panel: #2f3d4c; --field: #1c2630; --line: #43546a; --line-soft: #364658;
        --text: #e6ebf1; --muted: #9db0c4;
    }
    :root[data-theme="lightgray"], :root[data-theme="classic"] {
        color-scheme: light;
        --bg: #f1f1f1; --panel: #e3e3e3; --field: #ffffff; --line: #c2c2c2; --line-soft: #d9d9d9;
        --text: #1f1f1f; --muted: #5f5f5f; --accent: #0a6dc2; --onaccent: #ffffff;
        --warn: #a86b00; --danger: #c62832; --ondanger: #ffffff; --ok: #1e7d3a;
    }
    :root[data-theme="classic"] { --bg: #e9ecef; --panel: #dce1e6; --line: #bcc3cb; --line-soft: #d3d8de; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 "Segoe UI", system-ui, -apple-system, "Microsoft YaHei UI", "Yu Gothic UI", sans-serif;
    }
    [hidden] { display: none !important; }
    input, select, textarea, button { font: inherit; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* Barre du haut */
    .top { display: flex; gap: 6px; padding: 10px 10px 8px; }
    #search, #lang, .form input[type="text"], .form select {
        padding: 6px 8px;
        background: var(--field);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
    }
    #search { flex: 1; min-width: 0; }
    #lang { width: 86px; padding: 0 4px; }
    #search:focus, #lang:focus, .form input:focus, .form select:focus, .cmt:focus {
        outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent);
    }
    #refresh {
        width: 32px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }
    #refresh:hover { color: var(--text); border-color: var(--muted); }

    /* Largeurs des colonnes (redimensionnables, partagées par l'en-tête et les lignes) */
    :root { --w-name: 140px; --w-unit: 52px; --w-expr: 200px; --w-val: 100px; }

    .colhead, .row {
        display: grid;
        column-gap: 6px;
        grid-template-columns: 26px minmax(0, 1fr) auto auto;
    }
    .colhead { display: none; }

    #list { flex: 1; overflow: auto; padding: 0 10px 12px; }
    #list::-webkit-scrollbar { width: 8px; }
    #list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    /* Sections : Favoris / Paramètres utilisateur / Paramètres du modèle */
    .sec { margin-top: 6px; }
    .sechead {
        display: flex;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--line-soft);
        border-radius: 4px;
    }
    .sectoggle {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        background: none;
        color: var(--text);
        border: 0;
        text-align: left;
        font-weight: 600;
        cursor: pointer;
    }
    .chev { width: 12px; color: var(--muted); font-size: 11px; }
    .count { margin-left: 2px; color: var(--muted); font-weight: 400; font-size: 12px; }
    .secadd {
        width: 28px;
        height: 28px;
        margin-right: 2px;
        background: none;
        color: var(--accent);
        border: 0;
        border-radius: 4px;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
    }
    .secadd:hover { background: var(--line-soft); }

    .row { align-items: center; row-gap: 5px; padding: 10px 0; border-bottom: 1px solid var(--line-soft);
           grid-template-areas: "star name val del" "expr expr expr expr" "cmt cmt cmt cmt" "msg msg msg msg"; }
    .star { grid-area: star; padding: 0; background: none; border: 0; color: var(--muted); font-size: 17px; line-height: 1; cursor: pointer; }
    .star:hover, .star.on { color: var(--warn); }
    .name { grid-area: name; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .unit { grid-area: unit; display: none; color: var(--muted); font-family: var(--mono); font-size: 12px; }
    .val { grid-area: val; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font: 12px var(--mono); }
    .del {
        grid-area: del;
        padding: 0 6px;
        background: none;
        color: var(--muted);
        border: 1px solid transparent;
        border-radius: 3px;
        line-height: 18px;
        cursor: pointer;
    }
    .del:hover { color: var(--danger); border-color: var(--line); }
    .del.confirm { color: var(--ondanger); background: var(--danger); border-color: var(--danger); font-weight: 600; }

    .expr, .cmt {
        display: block;
        width: 100%;
        padding: 6px 8px;
        background: var(--field);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        transition: border-color .25s;
    }
    .expr {
        grid-area: expr;
        resize: none;
        overflow: hidden;
        font: 12.5px/1.5 var(--mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }
    .cmt { grid-area: cmt; font-size: 12px; }
    .cmt::placeholder { color: var(--muted); opacity: .7; }
    .expr:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .row.dirty .expr, .cmt.dirty { border-color: var(--warn); }
    .row.error .expr { border-color: var(--danger); }
    .row.error .expr:focus { box-shadow: 0 0 0 1px var(--danger); }
    .row.saved .expr { border-color: var(--ok); }

    .msg { grid-area: msg; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
    .msg:empty { display: none; }
    .row.dirty .msg { color: var(--warn); }
    .row.error .msg { color: var(--danger); }

    .empty { padding: 20px 12px; text-align: center; color: var(--muted); line-height: 1.6; }

    /* Mode large : tableau à colonnes, comme la fenêtre « Modifier les paramètres ».
       L'en-tête et les lignes utilisent exactement les mêmes colonnes, donc restent alignés. */
    @media (min-width: 760px) {
        .colhead, .row {
            grid-template-columns: 26px var(--w-name) var(--w-unit) var(--w-expr) var(--w-val) minmax(110px, 1fr) 84px;
            min-width: calc(26px + var(--w-name) + var(--w-unit) + var(--w-expr) + var(--w-val) + 110px + 84px + 36px);
        }
        .colhead {
            display: grid;
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 8px 0 6px;
            background: var(--bg);
            color: var(--muted);
            font-size: 12px;
            border-bottom: 1px solid var(--line);
        }
        .row {
            align-items: start;
            grid-template-areas: "star name unit expr val cmt del" ". . . msg msg msg .";
        }
        .name, .unit, .val { padding-top: 6px; }
        .unit { display: block; }
        .val { max-width: none; }
        .star { padding-top: 5px; }
    }

    /* Cellules d'en-tête et poignées de redimensionnement */
    .hc { position: relative; min-width: 0; }
    .lbl { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hc.pad .lbl { padding-left: 9px; }   /* aligne le libellé sur le texte saisi dans les champs */
    .grip {
        position: absolute;
        top: -4px;
        bottom: -4px;
        right: -9px;
        width: 12px;
        cursor: col-resize;
        touch-action: none;
    }
    .grip::after {
        content: "";
        position: absolute;
        top: 4px;
        bottom: 4px;
        left: 5px;
        width: 2px;
        border-radius: 1px;
        background: var(--line);
    }
    .grip:hover::after, .grip:focus-visible::after, .grip.drag::after { background: var(--accent); }
    .grip:focus-visible { outline: none; }

    /* Autocomplétion des formules et renommage */
    .ac {
        position: fixed;
        z-index: 60;
        max-height: 190px;
        overflow-y: auto;
        padding: 2px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
        font-size: 12.5px;
    }
    .ac-item { display: flex; align-items: baseline; gap: 10px; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
    .ac-item.sel { background: var(--accent); color: var(--onaccent); }
    .ac-name { font-family: var(--mono); }
    .ac-info {
        margin-left: auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font: 11.5px var(--mono);
    }
    .ac-kind { flex-shrink: 0; color: var(--muted); font-size: 11px; }
    .ac-item.sel .ac-info, .ac-item.sel .ac-kind { color: inherit; opacity: .85; }
    .rename {
        grid-area: name;
        min-width: 0;
        width: 100%;
        padding: 2px 6px;
        background: var(--field);
        color: var(--text);
        border: 1px solid var(--accent);
        border-radius: 3px;
        box-shadow: 0 0 0 1px var(--accent);
        font: inherit;
        font-weight: 600;
        outline: none;
    }
    .name:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }

    /* Formulaire d'ajout */
    #footer { padding: 8px 10px 10px; border-top: 1px solid var(--line); background: var(--panel); }
    .btn {
        padding: 7px 12px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        cursor: pointer;
    }
    .btn:hover { border-color: var(--muted); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--onaccent); font-weight: 600; }
    .btn.primary:hover { filter: brightness(1.08); }
    .form { display: grid; gap: 8px; }
    .form label { display: grid; gap: 3px; color: var(--muted); font-size: 12px; }
    .form input[type="text"], .form select { width: 100%; }
    .form .mono { font-family: var(--mono); font-size: 12.5px; }
    .form .pair { display: grid; grid-template-columns: 1fr 96px; gap: 8px; }
    .form .check { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 13px; }
    .form .actions { display: flex; gap: 8px; justify-content: flex-end; }
    #add-error { color: var(--danger); font-size: 11.5px; overflow-wrap: anywhere; }
    #add-error:empty { display: none; }
</style>
</head>
<body>

    <div class="top">
        <input id="search" type="search" data-i18n-ph="filter" data-i18n-aria="filter">
        <select id="lang" data-i18n-title="language"></select>
        <button id="refresh" data-i18n-title="refresh">↻</button>
    </div>

    <div id="list">
        <div class="colhead" id="colhead">
            <div class="hc"></div>
            <div class="hc"><span class="lbl" data-i18n="colName"></span><span class="grip" data-col="name" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="resizeCol"></span></div>
            <div class="hc"><span class="lbl" data-i18n="colUnit"></span><span class="grip" data-col="unit" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="resizeCol"></span></div>
            <div class="hc pad"><span class="lbl" data-i18n="colExpr"></span><span class="grip" data-col="expr" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="resizeCol"></span></div>
            <div class="hc"><span class="lbl" data-i18n="colValue"></span><span class="grip" data-col="val" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="resizeCol"></span></div>
            <div class="hc pad"><span class="lbl" data-i18n="colComment"></span></div>
            <div class="hc"></div>
        </div>
    </div>

    <div id="footer" hidden>
        <div id="add-form" class="form">
            <label><span data-i18n="fName"></span>
                <input id="f-name" type="text" autocomplete="off" spellcheck="false">
            </label>
            <div class="pair">
                <label><span data-i18n="fExpr"></span>
                    <input id="f-expr" class="mono" type="text" autocomplete="off" spellcheck="false">
                </label>
                <label><span data-i18n="fUnit"></span>
                    <select id="f-unit"></select>
                </label>
            </div>
            <label><span data-i18n="fComment"></span>
                <input id="f-comment" type="text" autocomplete="off">
            </label>
            <label class="check"><input id="f-fav" type="checkbox"><span data-i18n="fFav"></span></label>
            <div id="add-error"></div>
            <div class="actions">
                <button id="add-cancel" class="btn" data-i18n="cancel"></button>
                <button id="add-submit" class="btn primary" data-i18n="create"></button>
            </div>
        </div>
    </div>

    <script>
        const $ = s => document.querySelector(s);
        const list = $('#list');
        const colhead = $('#colhead');
        const state = {
            items: [], loaded: false, filter: '', errors: {}, flash: null, defaultUnit: 'mm',
            collapsed: { fav: false, user: false, model: false }
        };
        let rendering = false;
        let lastRequest = 0;
        let lastRaw = null;

        /* ---------- Largeur des colonnes ---------- */
        const COLS = {
            name: { prop: '--w-name', min: 70, def: 140 },
            unit: { prop: '--w-unit', min: 36, def: 52 },
            expr: { prop: '--w-expr', min: 120, def: 200 },
            val:  { prop: '--w-val',  min: 60,  def: 100 }
        };
        const colWidths = {};
        let dragging = false;
        let fitQueued = false;

        function refitAll() {
            if (fitQueued) return;
            fitQueued = true;
            requestAnimationFrame(() => {
                fitQueued = false;
                list.querySelectorAll('.expr').forEach(fit);
            });
        }

        function setCol(key, px) {
            const c = COLS[key];
            px = Math.max(c.min, Math.min(700, Math.round(px)));
            colWidths[key] = px;
            document.documentElement.style.setProperty(c.prop, px + 'px');
            refitAll();
        }

        function applyColumns(cols) {
            if (dragging || !cols) return;
            Object.keys(COLS).forEach(k => { if (typeof cols[k] === 'number') setCol(k, cols[k]); });
        }

        function saveColumns() { send('setColumns', colWidths); }

        document.querySelectorAll('.grip').forEach(grip => {
            const key = grip.dataset.col;
            grip.addEventListener('pointerdown', e => {
                e.preventDefault();
                const startX = e.clientX;
                const startW = grip.parentElement.getBoundingClientRect().width || COLS[key].def;
                dragging = true;
                grip.classList.add('drag');
                grip.setPointerCapture(e.pointerId);
                const move = ev => setCol(key, startW + ev.clientX - startX);
                const up = () => {
                    grip.removeEventListener('pointermove', move);
                    grip.removeEventListener('pointerup', up);
                    grip.removeEventListener('pointercancel', up);
                    grip.classList.remove('drag');
                    dragging = false;
                    saveColumns();
                };
                grip.addEventListener('pointermove', move);
                grip.addEventListener('pointerup', up);
                grip.addEventListener('pointercancel', up);
            });
            // Double-clic : largeur par défaut ; flèches gauche/droite : ajustement au clavier
            grip.addEventListener('dblclick', () => { setCol(key, COLS[key].def); saveColumns(); });
            grip.addEventListener('keydown', e => {
                if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                e.preventDefault();
                setCol(key, (colWidths[key] || COLS[key].def) + (e.key === 'ArrowRight' ? 10 : -10));
                saveColumns();
            });
        });

        const LANGS = [['en', 'English'], ['fr', 'Français'], ['de', 'Deutsch'], ['es', 'Español'],
                       ['it', 'Italiano'], ['pt', 'Português'], ['ja', '日本語'], ['zh', '中文']];
        let langPref = 'auto';
        let fusionLang = null;

        function guessLang() {
            const n = (navigator.language || 'en').toLowerCase().slice(0, 2);
            return I18N[n] ? n : 'en';
        }
        function effectiveLang() {
            if (langPref !== 'auto' && I18N[langPref]) return langPref;
            return fusionLang && I18N[fusionLang] ? fusionLang : guessLang();
        }
        let lang = effectiveLang();
        const t = (key, vars) => {
            let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
            if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
            return s;
        };

        // Message d'erreur explicite : code traduit + détail renvoyé par Fusion pour les formules
        const FORMULA_CODES = /^e_(formula|unknown|parens|self|empty)$/;
        function errText(r) {
            const code = r && r.error;
            if (!code) return t('invalid');
            let text = I18N.en[code] ? t(code, r.args) : code;
            if (r.fusion && FORMULA_CODES.test(code)) text += ' (Fusion: ' + r.fusion + ')';
            return text;
        }

        function applyTheme(theme) {
            let v = theme;
            if (!v || v === 'device') {
                const light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
                v = light ? 'lightgray' : 'darkgray';
            }
            document.documentElement.dataset.theme = v;
        }

        function buildLangSelect() {
            const sel = $('#lang');
            sel.replaceChildren();
            const auto = document.createElement('option');
            auto.value = 'auto';
            auto.textContent = t('auto');
            sel.appendChild(auto);
            LANGS.forEach(([code, label]) => {
                const o = document.createElement('option');
                o.value = code;
                o.textContent = label;
                sel.appendChild(o);
            });
            sel.value = langPref;
        }

        const UNITS = ['mm', 'cm', 'm', 'in', 'ft', 'deg', ''];

        function buildUnits() {
            const sel = $('#f-unit');
            const current = sel.value || state.defaultUnit;
            const units = UNITS.includes(state.defaultUnit) ? UNITS : [state.defaultUnit, ...UNITS];
            sel.replaceChildren();
            units.forEach(u => {
                const o = document.createElement('option');
                o.value = u;
                o.textContent = u === '' ? t('unitless') : u;
                sel.appendChild(o);
            });
            sel.value = units.includes(current) ? current : state.defaultUnit;
        }

        function applyI18n() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
            document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
            document.querySelectorAll('[data-i18n-aria]').forEach(e => e.setAttribute('aria-label', t(e.dataset.i18nAria)));
            document.querySelectorAll('[data-i18n-title]').forEach(e => {
                e.title = t(e.dataset.i18nTitle);
                e.setAttribute('aria-label', t(e.dataset.i18nTitle));
            });
            buildUnits();
            buildLangSelect();
        }

        /* ---------- Python -> HTML ---------- */
        window.fusionJavaScriptHandler = {
            handle: function (action, data) {
                try {
                    const msg = JSON.parse(data);
                    if (action === 'updateList') {
                        applyTheme(msg.theme);
                        applyColumns(msg.columns);
                        if (msg.fusionLang) fusionLang = msg.fusionLang;
                        if (msg.langPref) langPref = msg.langPref;
                        const unitChanged = msg.defaultUnit && msg.defaultUnit !== state.defaultUnit;
                        if (unitChanged) state.defaultUnit = msg.defaultUnit;
                        const newLang = effectiveLang();
                        const langChanged = newLang !== lang;
                        if (langChanged || unitChanged) { lang = newLang; applyI18n(); }
                        else buildLangSelect();
                        // Pas de rendu si rien n'a changé : on évite de perdre focus et défilement
                        if (data !== lastRaw || langChanged || !state.loaded) {
                            lastRaw = data;
                            state.items = msg.items || [];
                            state.loaded = true;
                            render(true);
                        }
                    } else if (action === 'paramResult') {
                        onResult(msg);
                    } else if (action === 'addResult') {
                        onAddResult(msg);
                    } else if (action === 'deleteResult') {
                        onDeleteResult(msg);
                    }
                } catch (e) {
                    list.textContent = t('errPrefix') + e;
                }
                return 'OK';
            }
        };

        /* ---------- HTML -> Python ---------- */
        function send(action, payload) {
            adsk.fusionSendData(action, typeof payload === 'string' ? payload : JSON.stringify(payload));
        }

        function request() {
            if (window.adsk && typeof adsk.fusionSendData === 'function') {
                send('getParams', '');
                lastRequest = Date.now();
                return true;
            }
            return false;
        }

        function waitAndRequest(tries) {
            if (request()) return;
            if (tries > 0) setTimeout(() => waitAndRequest(tries - 1), 200);
            else list.replaceChildren(el('div', 'empty', t('noConn')));
        }

        /* ---------- Rendu ---------- */
        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function fit(ta) {
            ta.style.height = 'auto';
            ta.style.height = ta.scrollHeight + 2 + 'px';
        }

        function updateMsg(row) {
            const name = row.dataset.name;
            const msg = row.querySelector('.msg');
            if (state.errors[name]) msg.textContent = state.errors[name];
            else if (row.classList.contains('dirty') || row.querySelector('.cmt').classList.contains('dirty')) msg.textContent = t('hint');
            else msg.textContent = row.dataset.meta || '';
        }

        function revertExpr(row) {
            const ta = row.querySelector('.expr');
            ta.value = ta.dataset.orig;
            row.classList.remove('dirty', 'error');
            delete state.errors[row.dataset.name];
            fit(ta);
            updateMsg(row);
        }

        function revertComment(row) {
            const cm = row.querySelector('.cmt');
            cm.value = cm.dataset.orig;
            cm.classList.remove('dirty');
            updateMsg(row);
        }

        function commitExpr(row) {
            if (rendering || row.dataset.pending) return;
            const ta = row.querySelector('.expr');
            const value = ta.value.trim();
            if (!value || value === ta.dataset.orig) { revertExpr(row); return; }
            row.dataset.pending = '1';
            row.dataset.sent = value;
            send('modifyParam', { name: row.dataset.name, value: value });
        }

        function commitComment(row) {
            if (rendering || row.dataset.cpending) return;
            const cm = row.querySelector('.cmt');
            const value = cm.value.trim();
            if (value === cm.dataset.orig) { revertComment(row); return; }
            row.dataset.cpending = '1';
            row.dataset.csent = value;
            send('setComment', { name: row.dataset.name, comment: value });
        }

        function makeRow(p, drafts) {
            const row = el('div', 'row');
            row.dataset.name = p.name;
            row.dataset.meta = p.kind === 'model'
                ? (p.role || '') + (p.creator ? ' (' + p.creator + ')' : '')
                : '';

            const star = el('button', 'star' + (p.favorite ? ' on' : ''), p.favorite ? '★' : '☆');
            star.title = p.favorite ? t('favRemove') : t('favAdd');
            star.setAttribute('aria-label', star.title);
            star.setAttribute('aria-pressed', String(!!p.favorite));
            star.addEventListener('click', () => send('setFavorite', { name: p.name, value: !p.favorite }));

            const name = el('span', 'name', p.name);
            name.title = p.name + ' (' + t('renameHint') + ')';
            name.tabIndex = 0;
            name.addEventListener('dblclick', () => startRename(row, name, p));
            name.addEventListener('keydown', e => {
                if (e.key === 'F2' || e.key === 'Enter') { e.preventDefault(); startRename(row, name, p); }
            });
            const unit = el('span', 'unit', p.unit || '');
            const val = el('span', 'val', p.value || '');
            val.title = p.value || '';
            row.append(star, name, unit, val);

            if (p.kind === 'user') {
                const del = el('button', 'del', '✕');
                del.title = t('del');
                del.setAttribute('aria-label', t('del') + ' ' + p.name);
                del.addEventListener('click', () => {
                    if (del.classList.contains('confirm')) { send('deleteParam', { name: p.name }); return; }
                    del.classList.add('confirm');
                    del.textContent = t('confirmDel');
                    setTimeout(() => {
                        if (del.isConnected) { del.classList.remove('confirm'); del.textContent = '✕'; }
                    }, 3000);
                });
                row.appendChild(del);
            }

            const ta = el('textarea', 'expr');
            ta.rows = 1;
            ta.spellcheck = false;
            ta.value = p.expression;
            ta.dataset.orig = p.expression;
            ta.setAttribute('aria-label', t('colExpr') + ' ' + p.name);
            attachAutocomplete(ta, () => p.name);   // doit précéder les autres écouteurs de touches du champ

            const cm = el('input', 'cmt');
            cm.type = 'text';
            cm.value = p.comment || '';
            cm.dataset.orig = p.comment || '';
            cm.placeholder = t('commentPh');
            cm.setAttribute('aria-label', t('colComment') + ' ' + p.name);

            if (drafts.has('e:' + p.name)) { ta.value = drafts.get('e:' + p.name); row.classList.add('dirty'); }
            if (drafts.has('c:' + p.name)) { cm.value = drafts.get('c:' + p.name); cm.classList.add('dirty'); }
            if (state.errors[p.name]) row.classList.add('error');
            if (state.flash === p.name) {
                row.classList.add('saved');
                state.flash = null;
                setTimeout(() => row.classList.remove('saved'), 900);
            }

            ta.addEventListener('input', () => {
                ta.value = ta.value.replace(/[\r\n]+/g, ' ');
                fit(ta);
                row.classList.toggle('dirty', ta.value !== ta.dataset.orig);
                row.classList.remove('error');
                delete state.errors[p.name];
                updateMsg(row);
            });
            ta.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); commitExpr(row); }
                else if (e.key === 'Escape') { revertExpr(row); }
                else if (e.key === 'F2') { e.preventDefault(); startRename(row, name, p); }
            });
            ta.addEventListener('blur', () => { if (row.classList.contains('dirty')) commitExpr(row); });

            cm.addEventListener('input', () => {
                cm.classList.toggle('dirty', cm.value !== cm.dataset.orig);
                delete state.errors[p.name];
                row.classList.remove('error');
                updateMsg(row);
            });
            cm.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); commitComment(row); }
                else if (e.key === 'Escape') { revertComment(row); }
            });
            cm.addEventListener('blur', () => { if (cm.classList.contains('dirty')) commitComment(row); });

            row.append(ta, cm, el('div', 'msg'));
            updateMsg(row);
            return row;
        }

        // Recherche : nom, formule, commentaire, valeur, unité, type (« Distance »…) et esquisse/fonction d'origine
        function matches(p, q) {
            if (!q) return true;
            return [p.name, p.expression, p.comment, p.value, p.unit, p.role, p.creator]
                .some(v => (v || '').toLowerCase().includes(q));
        }

        function makeSection(sec, drafts, q) {
            const open = !!q || !state.collapsed[sec.id];
            const wrap = el('section', 'sec');
            const head = el('div', 'sechead');

            const toggle = el('button', 'sectoggle');
            toggle.setAttribute('aria-expanded', String(open));
            toggle.append(el('span', 'chev', open ? '▾' : '▸'), el('span', '', sec.title),
                          el('span', 'count', String(sec.rows.length)));
            toggle.addEventListener('click', () => { state.collapsed[sec.id] = open; render(true); });
            head.appendChild(toggle);

            if (sec.id === 'user') {
                const add = el('button', 'secadd', '+');
                add.title = t('add');
                add.setAttribute('aria-label', t('add'));
                add.addEventListener('click', openForm);
                head.appendChild(add);
            }
            wrap.appendChild(head);

            if (open) {
                if (!sec.rows.length) wrap.appendChild(el('div', 'empty', t('emptyUser')));
                sec.rows.forEach(p => wrap.appendChild(makeRow(p, drafts)));
            }
            return wrap;
        }

        function render(keepDrafts) {
            rendering = true;
            acClose();

            // Conserver saisies non validées et focus pendant un rafraîchissement
            const drafts = new Map();
            let focusKey = null, selStart = 0, selEnd = 0;
            if (keepDrafts) {
                list.querySelectorAll('.row').forEach(r => {
                    const name = r.dataset.name;
                    const ta = r.querySelector('.expr');
                    const cm = r.querySelector('.cmt');
                    if (r.classList.contains('dirty')) drafts.set('e:' + name, ta.value);
                    if (cm.classList.contains('dirty')) drafts.set('c:' + name, cm.value);
                    const active = document.activeElement;
                    if (active === ta || active === cm) {
                        focusKey = (active === ta ? 'e:' : 'c:') + name;
                        selStart = active.selectionStart;
                        selEnd = active.selectionEnd;
                    }
                });
            }
            const scroll = list.scrollTop;

            const q = state.filter.trim().toLowerCase();
            const rows = state.items.filter(p => matches(p, q));
            const sections = [
                { id: 'fav', title: t('secFav'), rows: rows.filter(p => p.favorite) },
                { id: 'user', title: t('secUser'), rows: rows.filter(p => p.kind === 'user' && !p.favorite) },
                { id: 'model', title: t('secModel'), rows: rows.filter(p => p.kind === 'model' && !p.favorite) }
            ];

            list.replaceChildren(colhead);
            if (!state.loaded) {
                list.appendChild(el('div', 'empty', t('loading')));
            } else if (q && !rows.length) {
                list.appendChild(el('div', 'empty', t('noResult', { q: state.filter.trim() })));
            } else {
                sections.forEach(sec => {
                    const visible = sec.id === 'user' ? !q || sec.rows.length : sec.rows.length;
                    if (visible) list.appendChild(makeSection(sec, drafts, q));
                });
                list.querySelectorAll('.expr').forEach(fit);
            }

            colhead.hidden = !list.querySelector('.row');
            list.scrollTop = scroll;
            const saved = list.querySelector('.row.saved');
            if (saved) saved.scrollIntoView({ block: 'nearest' });

            if (focusKey) {
                const name = focusKey.slice(2);
                const row = [...list.querySelectorAll('.row')].find(r => r.dataset.name === name);
                if (row) {
                    const target = row.querySelector(focusKey.startsWith('e:') ? '.expr' : '.cmt');
                    target.focus();
                    target.setSelectionRange(selStart, selEnd);
                }
            }
            rendering = false;
        }

        function findRow(name) {
            return [...list.querySelectorAll('.row')].find(r => r.dataset.name === name);
        }

        function onResult(msg) {
            const row = findRow(msg.name);
            if (!row) return;
            const field = msg.field || 'expression';
            if (field === 'expression') {
                const ta = row.querySelector('.expr');
                delete row.dataset.pending;
                if (msg.ok) {
                    delete state.errors[msg.name];
                    ta.dataset.orig = row.dataset.sent || ta.value;
                    ta.value = ta.dataset.orig;
                    row.classList.remove('dirty', 'error');
                    state.flash = msg.name;
                    fit(ta);
                } else {
                    state.errors[msg.name] = errText(msg);
                    row.classList.add('error');
                }
            } else if (field === 'comment') {
                const cm = row.querySelector('.cmt');
                delete row.dataset.cpending;
                if (msg.ok) {
                    delete state.errors[msg.name];
                    cm.dataset.orig = row.dataset.csent || '';
                    cm.value = cm.dataset.orig;
                    cm.classList.remove('dirty');
                } else {
                    state.errors[msg.name] = errText(msg);
                    row.classList.add('error');
                }
            } else if (field === 'name') {
                if (msg.ok) {
                    delete state.errors[msg.name];
                    state.flash = msg.newName;
                } else {
                    state.errors[msg.name] = errText(msg);
                    row.classList.add('error');
                }
            } else if (!msg.ok) {
                state.errors[msg.name] = errText(msg);
                row.classList.add('error');
            }
            updateMsg(row);
        }

        function onDeleteResult(msg) {
            if (msg.ok) return; // la liste mise à jour arrive juste après
            const row = findRow(msg.name);
            if (!row) return;
            state.errors[msg.name] = errText(msg);
            row.classList.add('error');
            updateMsg(row);
        }

        /* ---------- Renommer un paramètre (double-clic sur le nom, ou F2) ---------- */
        function startRename(row, nameEl, p) {
            if (row.querySelector('.rename')) return;
            const input = el('input', 'rename');
            input.type = 'text';
            input.value = p.name;
            input.spellcheck = false;
            input.setAttribute('aria-label', t('renameHint'));
            let finished = false;
            const finish = apply => {
                if (finished) return;
                finished = true;
                const v = input.value.trim();
                if (input.isConnected) input.replaceWith(nameEl);
                if (apply && v && v !== p.name) send('renameParam', { name: p.name, newName: v });
            };
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); finish(true); nameEl.focus(); }
                else if (e.key === 'Escape') { e.preventDefault(); finish(false); nameEl.focus(); }
            });
            input.addEventListener('blur', () => { if (!rendering) finish(true); });
            nameEl.replaceWith(input);
            input.focus();
            input.select();
        }

        /* ---------- Autocomplétion (IntelliSense) dans la saisie des formules ----------
           Propose les paramètres du document, les fonctions et les unités de Fusion.
           Les fonctions viennent de la page « Parameters reference » de l'aide Fusion ;
           plusieurs arguments se séparent par un point-virgule. */
        const FUNCS = [
            ['sin', 'sin(angle)'], ['cos', 'cos(angle)'], ['tan', 'tan(angle)'],
            ['asin', 'asin(x)'], ['acos', 'acos(x)'], ['atan', 'atan(x)'],
            ['sinh', 'sinh(angle)'], ['cosh', 'cosh(angle)'], ['tanh', 'tanh(angle)'],
            ['asinh', 'asinh(x)'], ['acosh', 'acosh(x)'], ['atanh', 'atanh(x)'],
            ['sqrt', 'sqrt(x)'], ['abs', 'abs(x)'], ['sign', 'sign(x)'], ['exp', 'exp(x)'],
            ['ln', 'ln(x)'], ['log', 'log(x)'],
            ['floor', 'floor(x)'], ['ceil', 'ceil(x)'], ['round', 'round(x)'],
            ['max', 'max(a; b)'], ['min', 'min(a; b)'], ['pow', 'pow(x; n)'], ['random', 'random()']
        ];
        const UNIT_WORDS = ['mm', 'cm', 'm', 'in', 'ft', 'deg', 'rad', 'ul'];
        const ac = { box: null, items: [], sel: 0, el: null, tok: null, suppress: false };
        const WORD = /[\p{L}\p{N}_]/u;

        function acClose() {
            if (ac.box) ac.box.remove();
            ac.box = null;
            ac.items = [];
            ac.el = null;
        }

        // Mot en cours de saisie à la position du curseur (les chiffres qui précèdent, comme dans « 25mm », sont ignorés)
        function acToken(inp) {
            const pos = inp.selectionStart;
            if (pos !== inp.selectionEnd) return null;
            const text = inp.value;
            let s = pos;
            while (s > 0 && WORD.test(text[s - 1])) s--;
            let start = s;
            while (start < pos && /[0-9]/.test(text[start])) start++;
            let endAll = pos;
            while (endAll < text.length && WORD.test(text[endAll])) endAll++;
            return { start: start, end: pos, endAll: endAll, text: text.slice(start, pos) };
        }

        function acCandidates(prefix, ownName) {
            const p = prefix.toLowerCase();
            const all = [];
            state.items.forEach(it => {
                if (it.name === ownName) return;   // un paramètre ne peut pas se référencer lui-même
                all.push({ label: it.name, insert: it.name, kind: it.kind === 'user' ? 'kindUser' : 'kindModel',
                           info: it.value || '', order: it.kind === 'user' ? 0 : 1 });
            });
            FUNCS.forEach(([name, sig]) => all.push({
                label: name, insert: name === 'random' ? 'random()' : name + '(', kind: 'kindFunc', info: sig, order: 2 }));
            UNIT_WORDS.forEach(u => all.push({ label: u, insert: u, kind: 'kindUnit', info: '', order: 3 }));

            const ranked = [];
            all.forEach(c => {
                const l = c.label.toLowerCase();
                let score = -1;
                if (!p) score = 1;
                else if (l.startsWith(p)) score = 0;
                else if (p.length >= 2 && l.includes(p)) score = 1;
                if (score >= 0) ranked.push({ c, score });
            });
            ranked.sort((a, b) => a.score - b.score || a.c.order - b.c.order || a.c.label.localeCompare(b.c.label));
            return ranked.slice(0, 40).map(r => r.c);
        }

        function acPosition() {
            const box = ac.box;
            if (!box || !ac.el) return;
            const r = ac.el.getBoundingClientRect();
            box.style.minWidth = Math.min(Math.max(r.width, 220), 340) + 'px';
            box.style.maxHeight = '190px';
            box.style.left = Math.max(4, Math.min(r.left, window.innerWidth - box.offsetWidth - 4)) + 'px';
            // Sous le champ si la place suffit, sinon au-dessus ; la hauteur est limitée à la place disponible
            const availBelow = window.innerHeight - r.bottom - 6;
            const availAbove = r.top - 6;
            const below = availBelow >= Math.min(box.offsetHeight, 140) || availBelow >= availAbove;
            box.style.maxHeight = Math.max(60, Math.min(190, below ? availBelow : availAbove)) + 'px';
            const h = box.offsetHeight;
            box.style.top = (below ? r.bottom + 2 : Math.max(4, r.top - h - 2)) + 'px';
        }

        function acMark() {
            [...ac.box.children].forEach((node, i) => {
                const on = i === ac.sel;
                node.classList.toggle('sel', on);
                node.setAttribute('aria-selected', String(on));
                if (on) node.scrollIntoView({ block: 'nearest' });
            });
        }

        function acOpen(inp, ownName, force) {
            if (ac.suppress) return;
            const tok = acToken(inp);
            if (!tok || (!tok.text && !force)) { acClose(); return; }
            const items = acCandidates(tok.text, ownName());
            if (!items.length || (!force && items.length === 1 && items[0].label === tok.text)) { acClose(); return; }

            acClose();
            ac.el = inp;
            ac.tok = tok;
            ac.items = items;
            ac.sel = 0;
            const box = el('div', 'ac');
            box.setAttribute('role', 'listbox');
            // mousedown + preventDefault : le champ garde le focus, donc pas de validation prématurée
            box.addEventListener('mousedown', e => e.preventDefault());
            items.forEach((it, i) => {
                const row = el('div', 'ac-item');
                row.setAttribute('role', 'option');
                row.append(el('span', 'ac-name', it.label), el('span', 'ac-info', it.info), el('span', 'ac-kind', t(it.kind)));
                row.addEventListener('mousedown', e => { e.preventDefault(); acAccept(i); });
                box.appendChild(row);
            });
            document.body.appendChild(box);
            ac.box = box;
            acMark();
            acPosition();
        }

        function acAccept(i) {
            const it = ac.items[i];
            const inp = ac.el;
            const tok = ac.tok;
            if (!it || !inp || !tok) return;
            ac.suppress = true;
            inp.value = inp.value.slice(0, tok.start) + it.insert + inp.value.slice(tok.endAll);
            const caret = tok.start + it.insert.length;
            inp.setSelectionRange(caret, caret);
            inp.dispatchEvent(new Event('input', { bubbles: true }));   // met à jour l'état « modifié » et la hauteur
            ac.suppress = false;
            acClose();
            inp.focus();
        }

        function attachAutocomplete(inp, ownName) {
            // Enregistré avant les autres écouteurs du champ : il consomme les touches quand la liste est ouverte
            inp.addEventListener('keydown', e => {
                if (e.key === ' ' && e.ctrlKey) {
                    e.preventDefault(); e.stopImmediatePropagation();
                    acOpen(inp, ownName, true);
                    return;
                }
                if (!ac.box || ac.el !== inp) return;
                const consume = () => { e.preventDefault(); e.stopImmediatePropagation(); };
                if (e.key === 'ArrowDown') { consume(); ac.sel = (ac.sel + 1) % ac.items.length; acMark(); }
                else if (e.key === 'ArrowUp') { consume(); ac.sel = (ac.sel - 1 + ac.items.length) % ac.items.length; acMark(); }
                else if (e.key === 'Enter' || e.key === 'Tab') { consume(); acAccept(ac.sel); }
                else if (e.key === 'Escape') { consume(); acClose(); }
            });
            inp.addEventListener('input', () => acOpen(inp, ownName, false));
            inp.addEventListener('blur', acClose);
            inp.addEventListener('keyup', e => {
                if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) acClose();
            });
        }

        attachAutocomplete($('#f-expr'), () => $('#f-name').value.trim());
        list.addEventListener('scroll', acClose);
        window.addEventListener('resize', acClose);

        /* ---------- Ajout d'un paramètre ---------- */
        function openForm() {
            $('#footer').hidden = false;
            $('#add-error').textContent = '';
            $('#f-name').focus();
        }

        function closeForm(reset) {
            $('#footer').hidden = true;
            $('#add-error').textContent = '';
            if (reset) {
                ['#f-name', '#f-expr', '#f-comment'].forEach(s => { $(s).value = ''; });
                $('#f-fav').checked = false;
            }
        }

        function submitForm() {
            const name = $('#f-name').value.trim();
            const expression = $('#f-expr').value.trim();
            if (!name || !expression) { $('#add-error').textContent = t('e_missing'); return; }
            $('#add-error').textContent = '';
            send('addParam', {
                name: name,
                expression: expression,
                unit: $('#f-unit').value,
                comment: $('#f-comment').value.trim(),
                favorite: $('#f-fav').checked
            });
        }

        function onAddResult(msg) {
            if (msg.ok) {
                state.flash = msg.name;
                closeForm(true);
            } else {
                $('#add-error').textContent = errText(msg);
            }
        }

        $('#add-cancel').addEventListener('click', () => closeForm(false));
        $('#add-submit').addEventListener('click', submitForm);
        ['#f-name', '#f-expr', '#f-comment'].forEach(s => {
            $(s).addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); submitForm(); }
                else if (e.key === 'Escape') { closeForm(false); }
            });
        });

        /* ---------- Interactions générales ---------- */
        $('#refresh').addEventListener('click', request);

        $('#lang').addEventListener('change', e => {
            langPref = e.target.value;
            lang = effectiveLang();
            applyI18n();
            render(true);
            send('setLanguage', { lang: langPref });
        });

        $('#search').addEventListener('input', e => {
            state.filter = e.target.value;
            render(true);
        });
        $('#search').addEventListener('keydown', e => {
            if (e.key === 'Escape') { e.target.value = ''; state.filter = ''; render(true); }
        });

        // Les valeurs évoluent quand on modifie le modèle : on rafraîchit au retour sur la palette
        window.addEventListener('focus', () => {
            if (Date.now() - lastRequest > 1500) request();
        });
        window.addEventListener('resize', () => list.querySelectorAll('.expr').forEach(fit));

        window.addEventListener('load', () => {
            applyI18n();
            render(false);
            waitAndRequest(25);
        });
    </script>
</body>
</html>
